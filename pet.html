<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDog — Living Desktop Companion</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐶</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=VT323&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="transparent-pet-mode">

  <!-- Minimal Floating Desktop Dog Mascot Container (NO Settings UI) -->
  <div class="pet-character-root" id="dog-root">
    
    <!-- Small Contextual Speech Bubble -->
    <div class="cat-speech-bubble" id="speech-bubble" style="display: none;">
      <span class="bubble-text" id="bubble-text">Woof! Living on your desktop! 🐾</span>
    </div>

    <!-- Interactive & Draggable Pixel Dog Character -->
    <div class="interactive-cat-wrapper" id="dog-wrapper" title="Click to interact / Drag across screen">
      <div id="dog-svg-container" class="cat-svg-box"></div>
      <div class="cat-shadow"></div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/dog-audio.js"></script>
  <script src="js/dog-renderer.js"></script>
  <script src="js/dog-state-machine.js"></script>
  <script src="js/personality-system.js"></script>
  <script src="js/movement-engine.js"></script>
  <script src="js/activity-monitor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
